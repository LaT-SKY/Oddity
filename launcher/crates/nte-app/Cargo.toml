[package]
name = "nte-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Linux launcher shell for Neverness To Everness (Tauri 2)"

[[bin]]
name = "oddity"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
nte-core = { path = "../nte-core" }
libc = "0.2"
zeroize = "1"
base64 = "0.23"
tauri-plugin-dialog = "2"
sdl3 = { version = "0.20.0", features = ["build-from-source-static"] }
sdl3-sys = { version = "0.7.2", features = ["sdl-unix-console-build", "no-sdl-video", "no-sdl-gpu", "no-sdl-render", "no-sdl-camera", "no-sdl-dialog", "no-sdl-tray"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
zip.workspace = true
