[package]
name = "nte-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for the native Linux launcher of Neverness To Everness"

[dependencies]
libc = "0.2"
anyhow.workspace = true
md-5.workspace = true
ureq.workspace = true
zip.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
aes.workspace = true
cbc.workspace = true
cipher.workspace = true
flate2.workspace = true
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
base64 = "0.23"
zeroize = "1"
regex = "1"
tempfile = "3"
encoding_rs_io = "0.1"
hdiffpatch-rs = { git = "https://github.com/TwintailTeam/hdiffpatch-rs", rev = "d58f4553b7d45acccd0b8e3b57badc26b9b04b6e" }
