[workspace]
resolver = "2"
members = [
    "crates/nte-core",
    "crates/nte-cli",
    "crates/nte-app",
]

[workspace.package]
version = "0.1.0-rc1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
md-5 = "0.10"
ureq = { version = "2.10", default-features = true }
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
flate2 = "1"
