# Oddity 依赖检查策略
# 在 launcher/ 目录下运行 `cargo deny check` 以检查

[graph]
all-features = false
no-default-features = false

[advisories]
# 只有给出具体理由并安排好到期处理计划，才能在这里添加条目
ignore = [
  # 构建期宏 crate，由 gtk3-macros 0.18 引入，不进入运行时
  { id = "RUSTSEC-2024-0370", reason = "gtk3-macros 的构建期依赖，不进入运行时；2027-06 前随 gtk-rs 升级移除" },
  # zbus 5 的子 crate，等 tauri-plugin-single-instance 升级到 zbus 6
  { id = "RUSTSEC-2026-0370", reason = "由 tauri-plugin-single-instance 依赖的 zbus 5 引入，zbus 6 已合并该 crate；2027-06 前随插件升级移除" },
  { id = "RUSTSEC-2026-0371", reason = "由 tauri-plugin-single-instance 依赖的 zbus 5 引入，zbus 6 已合并该 crate；2027-06 前随插件升级移除" },
  { id = "RUSTSEC-2026-0372", reason = "由 tauri-plugin-single-instance 依赖的 zbus 5 引入，zbus 6 已合并该 crate；2027-06 前随插件升级移除" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Tauri、GTK 和平台适配链由上游分别约束多个版本；强行收敛会引入不兼容升级。
# 依赖更新仍由 Cargo.lock 和 advisories 检查负责，暂不把这类传递依赖提示当作告警。
multiple-versions = "allow"
# nte-app/nte-cli 对同一 workspace 内的 nte-core 使用 path dependency，版本字段没有意义。
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
