# 只维护 area、ci 和 docs 标签
"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "launcher/ui/**"
"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "launcher/crates/nte-cli/**"
"area: launcher":
  - changed-files:
      - any-glob-to-any-file:
          - "launcher/crates/nte-app/**"
"area: packaging":
  - changed-files:
      - any-glob-to-any-file:
          - "launcher/packaging/**"
          - "launcher/scripts/install-desktop.sh"
          - "launcher/crates/nte-app/tauri.conf.json"
          - "packaging/**"
          - "scripts/release-version.mjs"
          - "scripts/stage-release.mjs"
          - "scripts/render-pkgbuild.mjs"
          - "scripts/write-checksums.mjs"
          - "scripts/check-release-assets.mjs"
          - "scripts/build-arch-package.sh"
          - "scripts/render-ebuild.mjs"
          - "flake.nix"
          - "flake.lock"
          - "nix/**"
          - "packaging/gentoo/**"
"area: updater":
  - changed-files:
      - any-glob-to-any-file:
          - "launcher/crates/nte-core/src/game/**"
          - "launcher/crates/nte-core/src/update.rs"
          - "launcher/crates/nte-core/src/manifest.rs"
"area: proton":
  - changed-files:
      - any-glob-to-any-file:
          - "launcher/crates/nte-core/src/launch.rs"
          - "launcher/crates/nte-core/src/config.rs"
"ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
"docs":
  - changed-files:
      - any-glob-to-all-files:
          - "{docs/**,**/*.md}"
