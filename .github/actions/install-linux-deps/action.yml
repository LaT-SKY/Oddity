name: 安装 Linux 依赖
description: 安装构建和打包 Oddity 所需的库

runs:
  using: composite
  steps:
    - name: 恢复 apt 包缓存
      uses: actions/cache@v6
      with:
        path: ~/.cache/oddity-apt
        # 改动包列表后递增 v3
        key: apt-archives-${{ runner.os }}-v3
        restore-keys: |
          apt-archives-${{ runner.os }}-

    - name: 安装 apt 软件包
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        archives="$HOME/.cache/oddity-apt"
        mkdir -p "$archives"
        # 命中缓存时 apt 会优先使用本地 deb, 不再走镜像
        sudo cp -n "$archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        # 直接使用官方源, 避免 Azure 镜像反复挂起.
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        apt_options=(
          -o Acquire::Retries=2
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        timeout --kill-after=10s 5m sudo apt-get "${apt_options[@]}" update
        timeout --kill-after=10s 10m sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          patchelf \
          file \
          desktop-file-utils \
          dpkg-dev \
          rpm \
          libarchive-tools \
          libfuse2 \
          zstd \
          xvfb \
          dbus-x11
        sudo cp -n /var/cache/apt/archives/*.deb "$archives"/ 2>/dev/null || true
