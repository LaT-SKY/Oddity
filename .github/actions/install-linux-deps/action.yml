name: 安装 Linux 依赖
description: 安装构建和打包 Oddity 所需的库

runs:
  using: composite
  steps:
    - name: 安装 apt 软件包
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          patchelf \
          file \
          desktop-file-utils \
          dpkg-dev
