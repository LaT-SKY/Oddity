name: 安装 Linux 依赖
description: 安装构建和打包 Oddity 所需的库

runs:
  using: composite
  steps:
    - name: 恢复 apt 包缓存
      uses: actions/cache@v6
      with:
        path: ~/.cache/oddity-apt
        # 改动包列表后递增 v2
        key: apt-archives-${{ runner.os }}-v2
        restore-keys: |
          apt-archives-${{ runner.os }}-

    - name: 安装 apt 软件包
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        archives="$HOME/.cache/oddity-apt"
        mkdir -p "$archives"
        # 命中缓存时 apt 会优先使用本地 deb, 不再走镜像
        sudo cp -n "$archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          patchelf \
          file \
          desktop-file-utils \
          dpkg-dev \
          rpm \
          libarchive-tools \
          libfuse2 \
          zstd
        sudo cp -n /var/cache/apt/archives/*.deb "$archives"/ 2>/dev/null || true
