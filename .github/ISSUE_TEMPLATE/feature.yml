name: 功能请求
description: 提出新功能或使用体验改进
title: "[FEATURE] "
labels: ["feature", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，确认没有相同的建议。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 和文档。
          required: true
        - label: 这不是安全漏洞。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题
      description: 描述当前的使用场景和痛点。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改
      description: 描述期望的行为、交互或配置方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。有没有其他做法，为什么不如上面的方案。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可选。可以附参考截图、链接或类似项目的实现。
    validations:
      required: false
