name: 崩溃报告
description: 报告崩溃、闪退或启动即退出的问题
title: "[CRASH] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        崩溃通常需要日志才能定位。提交前请先查看[排障指南](https://github.com/LaT-SKY/Oddity/blob/main/docs/troubleshooting.md)。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 和文档，确认这不是重复问题。
          required: true
        - label: 我使用的是最新版本，或已说明无法升级的原因。
          required: true
        - label: 我提交的日志和截图已经脱敏。
          required: true
        - label: 这不是安全漏洞。
          required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供 Oddity 版本、发行版、桌面环境、显卡驱动，以及 Proton / umu-launcher 版本。
      placeholder: |
        Oddity: v0.1.0-alpha.1
        发行版: ...
        桌面环境: Wayland / Plasma / Hyprland
        显卡与驱动: ...
        Proton: ...
        umu-launcher: ...
    validations:
      required: true

  - type: textarea
    id: crash
    attributes:
      label: 崩溃时发生了什么
      description: 崩溃前正在执行什么操作？是否每次都能复现？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        请附上 `~/.local/share/oddity/logs/nte-app-launch.log` 的末尾内容；
        如果涉及官方启动器窗口，也请附上 `helper-window.log`。

        请先移除账号、UID、token、手机号等个人信息。
      render: text
    validations:
      required: true
