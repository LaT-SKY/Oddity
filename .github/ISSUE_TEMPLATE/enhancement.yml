name: 体验优化
description: 改进现有功能的使用体验、界面或交互细节
title: "[ENHANCEMENT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，确认没有相同的优化建议。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 和文档。
          required: true
        - label: 这不是安全漏洞。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前体验或痛点
      description: 描述现有功能在使用过程中的不便之处或可优化点。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 优化建议
      description: 描述期望的视觉展现、交互流程或体验改进方案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。有没有其他做法，为什么不如上面的方案。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可选。可以附参考截图、对照图、链接或设计说明。
    validations:
      required: false
