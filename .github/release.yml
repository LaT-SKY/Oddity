changelog:
  exclude:
    labels:
      - ci
      - duplicate
      - invalid
      - question
      - wontfix
      - "status: needs-info"
      - "status: blocked"
  categories:
    - title: 不兼容变更
      labels:
        - breaking
    - title: 新增功能
      labels:
        - feature
    - title: 问题修复
      labels:
        - bug
        - crash
        - security
    - title: 体验优化
      labels:
        - enhancement
        - performance
    - title: 其他变更
      labels:
        - "*"
