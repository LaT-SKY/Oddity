name: 智能体事件通知

on:
  workflow_run:
    workflows: ["发布版本"]
    types: [completed]
  release:
    types: [published]
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled, review_requested]
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-events
  cancel-in-progress: false

jobs:
  notify:
    name: 通知 dsh-superagent
    runs-on: ubuntu-latest
    steps:
      - name: 处理事件并通知
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issues" ]; then
            if [ "$EVENT_LABEL" != "TypeRota: implement" ]; then
              echo "Skip label: $EVENT_LABEL"
              exit 0
            fi
            gh issue comment "$EVENT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "@TypeRota 受理这个 Issue：请按仓库规则实现并提交 PR；如果范围或设计不明确，先留下方案与问题并停下。"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            if [ "$EVENT_LABEL" = "TypeRota: Review" ] || [ "$REQUESTED_REVIEWER" = "TypeRota" ]; then
              gh pr comment "$EVENT_PR" --repo "$GITHUB_REPOSITORY" --body "@TypeRota 请评审这个 PR：给出具体问题、风险与验证建议；没有阻塞问题时可以批准。"
            fi
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            tag="$RUN_BRANCH"
            case "$tag" in
              oddity-v*) ;;
              *) echo "Skip non-release workflow run on $tag"; exit 0 ;;
            esac
            title="[agent] Release $tag 发布检查"
            body=$(cat <<EOF
          发布工作流状态：$RUN_CONCLUSION
          工作流运行：$RUN_URL
          Release 链接：https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag

          请核对：release notes 与实际合并 PR、标签是否一致；AUR、Gentoo、Nix 打包是否成功；docs 版本引用是否需要更新。
          EOF
          )
          elif [ "$EVENT_NAME" = "release" ]; then
            title="[agent] Release $RELEASE_TAG 发布检查"
            body=$(cat <<EOF
          Release: $RELEASE_URL
          Tag: $RELEASE_TAG

          请核对：release notes 与实际合并 PR、标签是否一致；AUR、Gentoo、Nix 打包是否成功；docs 版本引用是否需要更新。
          EOF
          )
          else
            date=$(date -u +%Y-%m-%d)
            title="[agent] 每周记忆整理 $date"
            body="每周一次的记忆整理：把 journal 合并进 MEMORY.md，去重并保持 200 行以内。"
          fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title | jq --arg t "$title" -r 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open for: $title"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label chore
