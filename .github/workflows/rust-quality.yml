name: Rust 质量检查

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 检测变更
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      hygiene: "true"
    steps:
      - name: 筛选变更路径
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'launcher/Cargo.*'
              - 'launcher/crates/**'
              - 'launcher/deny.toml'
              - 'scripts/check-repo.mjs'
              - 'scripts/check-rust-coverage.mjs'
              - '.github/workflows/rust-quality.yml'
              - '.github/actions/install-linux-deps/**'
              - '.github/actions/verify-checks/**'

  hygiene:
    name: 文档、脚本、仓库检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 检查版本号、链接、纳入版本管理的路径
        run: |
          node scripts/check-repo.mjs
          node --test scripts/check-rust-coverage.test.mjs
          node --test scripts/release-version.test.mjs

      - name: 检查 Gentoo 发布版本保护
        run: |
          python3 -m venv "$RUNNER_TEMP/portage"
          "$RUNNER_TEMP/portage/bin/pip" install portage==3.0.81.2
          "$RUNNER_TEMP/portage/bin/python" scripts/test_gentoo_upgrade.py

      - name: 检查 shell 脚本
        run: |
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck --format=gcc "${files[@]}"

      - name: 检查 GitHub Actions 工作流
        uses: raven-actions/actionlint@v2.2.0

  checks:
    name: 格式、Clippy、测试、构建
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: launcher/ui/package.json
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: launcher/ui/pnpm-lock.yaml

      - name: 安装并构建前端
        working-directory: launcher/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 安装 Linux 依赖
        uses: ./.github/actions/install-linux-deps

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: 检查代码格式
        working-directory: launcher
        run: cargo fmt --all -- --check

      - name: 运行 Clippy
        working-directory: launcher
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 运行测试
        working-directory: launcher
        run: cargo test --workspace --locked

      - name: 构建工作区
        working-directory: launcher
        run: cargo build --workspace --locked

  coverage:
    name: 检查代码覆盖率
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: launcher/ui/package.json
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: launcher/ui/pnpm-lock.yaml

      - name: 安装并构建前端
        working-directory: launcher/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 安装 Linux 依赖
        uses: ./.github/actions/install-linux-deps

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          # 插桩 target 每次重编, 只缓存 registry
          cache-targets: false

      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: 生成覆盖率
        working-directory: launcher
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: 生成控制台摘要
        working-directory: launcher
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: 校验覆盖率门槛与增量覆盖率
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-rust-coverage.mjs

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            launcher/lcov.info
            launcher/coverage-summary.txt
          if-no-files-found: error

  deny:
    name: 依赖检查策略
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: 安全漏洞、许可证、依赖版本、供应链来源
        working-directory: launcher
        run: cargo deny check

  rust-quality:
    name: Rust 质量检查通过
    if: always()
    needs:
      - changes
      - checks
      - coverage
      - deny
      - hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 校验必要任务
        uses: ./.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "checks": "code",
              "coverage": "code",
              "deny": "code",
              "hygiene": "hygiene"
            }
