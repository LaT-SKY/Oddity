name: 发布版本

on:
  push:
    tags:
      - 'oddity-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，必须从该 tag 触发 workflow'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: 校验版本与 Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes_start: ${{ steps.meta.outputs.notes_start }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 校验 Tag 与版本
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::请从要发布的 tag 触发该 workflow"
            exit 1
          fi
          if [[ -n "$INPUT_TAG" && "$INPUT_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::输入的 tag 与触发引用不一致: $INPUT_TAG != $GITHUB_REF_NAME"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^oddity-v(.+)$ ]]; then
            echo "::error::tag 必须以 oddity-v 开头: $TAG"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          git fetch --tags --force origin
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "::error::tag 必须是 annotated tag: $TAG"
            exit 1
          fi

          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$commit" ]]; then
            echo "::error::检出的提交与 tag 不一致"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag 必须指向 main 上的提交"
            exit 1
          fi

          node scripts/check-release-version.mjs "$version" "$TAG"

          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          notes_start=""
          if [[ "$prerelease" == "false" ]]; then
            while read -r candidate; do
              [[ -z "$candidate" ]] && continue
              candidate_version="${candidate#oddity-v}"
              [[ "$candidate_version" == *-* ]] && continue
              [[ "$candidate" == "$TAG" ]] && continue
              if ! git merge-base --is-ancestor "refs/tags/$candidate^{commit}" "$commit"; then
                continue
              fi
              notes_start="$candidate"
              break
            done < <(git tag --list 'oddity-v*' --sort=-v:refname)

            if [[ -z "$notes_start" ]]; then
              series="${version%.*}"
              while read -r candidate; do
                [[ -z "$candidate" ]] && continue
                [[ "$candidate" == "$TAG" ]] && continue
                if git merge-base --is-ancestor "refs/tags/$candidate^{commit}" "$commit"; then
                  notes_start="$candidate"
                  break
                fi
              done < <(git tag --list "oddity-v${series}.*" --sort=v:refname)
            fi
          fi

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "notes_start=$notes_start"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 构建发布产物
    needs: verify
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-package.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}

  aur:
    needs: [verify, release]
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      commit: ${{ needs.verify.outputs.commit }}
    secrets:
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  release:
    name: 创建 GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      NOTES_START: ${{ needs.verify.outputs.notes_start }}
      COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: 下载构建产物
        uses: actions/download-artifact@v7
        with:
          name: oddity-linux-x86_64
          path: dist

      - name: 校验构建产物
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d dist/release ]]; then
            mv dist/release/* dist/
            rmdir dist/release
          fi
          test -f dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [[ "$count" -lt 6 ]]; then
            echo "::error::构建产物不完整"
            exit 1
          fi

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.4

      - name: 签名校验和
        shell: bash
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      - name: 清洗待发布 PR 排除标签
        run: node scripts/prepare-release-notes-labels.mjs

      - name: 生成 Release 说明
        shell: bash
        run: |
          set -euo pipefail
          args=(
            -X POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG"
            -f "target_commitish=$COMMIT"
            -f "configuration_file_path=.github/release.yml"
          )
          if [[ -n "$NOTES_START" ]]; then
            args+=(-f "previous_tag_name=$NOTES_START")
          fi
          gh api "${args[@]}" --jq .body > release-notes.md
          {
            echo
            echo "### 安装"
            echo
            echo '- Arch Linux: 下载 oddity-bin-*.pkg.tar.zst，执行 sudo pacman -U oddity-bin-*.pkg.tar.zst'
            echo '- Debian / Ubuntu: 下载 .deb，执行 sudo apt install ./oddity_*.deb'
            echo '- Fedora / openSUSE: 下载 .rpm，执行 sudo dnf install ./oddity-*.rpm 或 sudo zypper install ./oddity-*.rpm'
            echo '- AppImage: 执行 chmod +x oddity-*.AppImage && ./oddity-*.AppImage'
          } >> release-notes.md
          {
            echo
            echo "### 验证"
            echo
            echo "- 使用 GitHub CLI 验证附件 (Release 显示 \`Immutable\` 时): \`gh release verify-asset --repo ${GITHUB_REPOSITORY} ${TAG} <文件>\`"
            echo "- 使用 Sigstore 验证校验和: 见[安装指南](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/install.md#验证安装包)"
          } >> release-notes.md
          {
            echo "### Oddity ${VERSION}"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 创建或复用 Draft Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $TAG 已发布，不能覆盖"
              exit 1
            fi
            args=(--title "Oddity ${VERSION}" --notes-file release-notes.md)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release edit "$TAG" "${args[@]}"
          else
            args=(--verify-tag --draft --title "Oddity ${VERSION}" --notes-file release-notes.md)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi

      - name: 上传发布资产
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber

      - name: 发布 Release
        shell: bash
        run: |
          set -euo pipefail
          args=(--draft=false)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release edit "$TAG" "${args[@]}"

  gentoo:
    needs: [verify, release]
    uses: ./.github/workflows/gentoo.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      commit: ${{ needs.verify.outputs.commit }}
    secrets:
      GENTOO_OVERLAY_DEPLOY_KEY: ${{ secrets.GENTOO_OVERLAY_DEPLOY_KEY }}

  nix:
    needs: [verify, release]
    uses: ./.github/workflows/nix.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
