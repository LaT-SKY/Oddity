name: 构建并打包

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: 已验证的发布提交
        required: true
        type: string
      version:
        description: 要构建的发布版本, 留空时读取仓库版本
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 检测变更
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: 筛选变更路径
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'launcher/Cargo.toml'
              - 'launcher/Cargo.lock'
              - 'launcher/crates/*/Cargo.toml'
              - 'launcher/crates/**'
              - 'launcher/packaging/**'
              - 'launcher/scripts/install-desktop.sh'
              - 'launcher/ui/**'
              - 'packaging/**'
              - 'scripts/check-packaging.mjs'
              - 'scripts/electron-builder.test.mjs'
              - 'scripts/release-version.mjs'
              - 'scripts/stage-release.mjs'
              - 'scripts/render-pkgbuild.mjs'
              - 'scripts/write-checksums.mjs'
              - 'scripts/check-release-assets.mjs'
              - 'scripts/build-arch-package.sh'
              - '.github/workflows/build-package.yml'
              - '.github/workflows/release.yml'
              - '.github/actions/install-linux-deps/**'
              - '.github/actions/verify-checks/**'

  build:
    name: 构建 Linux 发行包
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: launcher/ui/package.json
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: launcher/ui/pnpm-lock.yaml

      - name: 安装并构建前端
        working-directory: launcher/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 安装 Linux 依赖
        uses: ./.github/actions/install-linux-deps

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: 缓存 Electron 打包工具
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-44-tools-${{ runner.os }}-v1

      - name: 读取版本
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="$(node scripts/release-version.mjs)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 检查打包元数据
        run: |
          node scripts/check-packaging.mjs
          node --test scripts/electron-builder.test.mjs

      - name: 构建 Release 二进制文件
        working-directory: launcher
        run: cargo build --release --locked -p nte-service -p nte-cli -p nte-recovery

      - name: 校验二进制文件类型
        run: |
          file launcher/target/release/oddity-backend
          file launcher/target/release/nte-cli
          file launcher/target/release/oddity-recovery

      - name: 构建 Electron 44 发行包
        working-directory: launcher/ui
        run: |
          pnpm exec install-electron
          pnpm run desktop:package

      - name: 校验桌面入口安装
        run: |
          tmp="$(mktemp -d)"
          XDG_DATA_HOME="$tmp/share" ./launcher/scripts/install-desktop.sh "$PWD/dist/electron/linux-unpacked/oddity"
          desktop-file-validate "$tmp/share/applications/oddity.desktop"
          desktop-file-validate "$tmp/share/applications/oddity-recovery.desktop"

      - name: 整理发布资产
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/stage-release.mjs --version "$VERSION" --out dist/release

      - name: 构建 Arch 软件包
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-arch-package.sh "$VERSION" "dist/release/oddity-${VERSION}-linux-x86_64.tar.gz" dist/release

      - name: Ubuntu 24.04 安装包沙箱启动验证
        run: |
          sudo apt-get update
          sudo apt-get install -y openbox xvfb xdotool dbus-x11 ./dist/release/oddity_*_amd64.deb
          # shellcheck disable=SC2016
          xvfb-run -a dbus-run-session sh -c '
            set -e
            openbox >/tmp/oddity-wm.log 2>&1 &
            /opt/Oddity/oddity >/tmp/oddity-package.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 30); do
              if xdotool search --onlyvisible --pid "$app_pid" --name "^Oddity$" >/dev/null 2>&1; then
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat /tmp/oddity-package.log
                exit 1
              fi
              sleep 1
            done
            cat /tmp/oddity-package.log
            echo "Oddity 窗口未在 30 秒内出现" >&2
            exit 1
          '

      - name: 生成校验和
        run: node scripts/write-checksums.mjs --dir dist/release

      - name: 校验发布资产
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/check-release-assets.mjs --version "$VERSION" --dir dist/release

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: oddity-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  build-package:
    name: 构建打包检查通过
    if: always()
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: 校验必要任务
        uses: ./.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "build": "code"
            }
