name: 检查 PR 标题

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题
    runs-on: ubuntu-latest
    steps:
      - name: 校验语义化标题
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
            ui
            core
            cli
            app
            launcher
            updater
            proton
            login
            packaging
            scripts
            deps
            release
          scopes: |
            ui
            core
            cli
            app
            launcher
            updater
            proton
            login
            packaging
            scripts
            docs
            ci
            deps
            release
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 标题描述不要以大写字母开头。

  sync-breaking-label:
    name: 同步 breaking 标签
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: 根据标题添加或移除 breaking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^[a-zA-Z]+(\([^\)]*\))?!: ]]; then
            gh pr edit "$PR" --add-label breaking
          else
            gh pr edit "$PR" --remove-label breaking
          fi
