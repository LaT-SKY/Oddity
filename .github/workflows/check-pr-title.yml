name: PR 标题与标签

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题
    runs-on: ubuntu-latest
    steps:
      - name: 校验语义化标题
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
            ui
            core
            cli
            app
            launcher
            updater
            proton
            login
            packaging
            scripts
            deps
            release
          scopes: |
            ui
            core
            cli
            app
            launcher
            updater
            proton
            login
            packaging
            scripts
            docs
            ci
            deps
            release
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 标题描述不要以大写字母开头。

  sync-labels:
    name: 同步 PR 标签
    needs: validate-pr-title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: pr-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: 同步标题和路径标签
        uses: actions/github-script@v9
        with:
          script: |
            const { syncPrLabels } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/sync-pr-labels.mjs`);
            await syncPrLabels({ github, context });
