name: Nix

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'launcher/**'
      - 'scripts/release-version.mjs'
      - '.github/workflows/nix.yml'
  push:
    branches:
      - main
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'launcher/**'
      - 'scripts/release-version.mjs'
      - '.github/workflows/nix.yml'
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Flake 与包构建
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: 安装 Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            connect-timeout = 15
            stalled-download-timeout = 60

      - name: 配置 Cachix
        # 拉取项目缓存时, 单个 250 MiB 的 pnpm 依赖对象在 runner 上会退化为
        # 数十 KB/s, 曾把 45 分钟作业预算耗尽; PR 改为本地重建这部分依赖
        if: github.event_name != 'pull_request'
        uses: cachix/cachix-action@v17
        with:
          name: oddity
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 检查 Flake
        timeout-minutes: 10
        run: nix flake check --print-build-logs

      - name: 构建源码包
        timeout-minutes: 25
        run: nix build .#oddity --print-build-logs
